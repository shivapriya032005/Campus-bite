# Development stack: hot reload, source bind-mounted, in-process scheduler, MySQL port published.
# Production: see docker-compose.prod.yml.
services:
  db:
    image: mysql:8.4
    container_name: campusbite-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campusbite}
      MYSQL_USER: ${MYSQL_USER:-campusbite_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_this_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_this_root_password}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"   # set MYSQL_HOST_PORT if 3306 is taken on your machine
    volumes:
      - campusbite_mysql_data:/var/lib/mysql
    healthcheck:
      # (healthcheck.sh only exists in MariaDB images; ping over TCP so the init-time temp server doesn't count)
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      target: dev
    container_name: campusbite-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_HOST: db
      DATABASE_URL_OVERRIDE: ""   # always use the MySQL container here, even if .env points at SQLite
      SCHEDULER_ENABLED: "true"   # dev: scheduler runs inside the API process (lease-guarded)
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  campusbite_mysql_data:
