services:
  db:
    image: mysql:8.4
    container_name: campusbite-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campusbite}
      MYSQL_USER: ${MYSQL_USER:-campusbite_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_this_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_this_root_password}
    ports:
      - "3306:3306"
    volumes:
      - campusbite_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
    container_name: campusbite-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_HOST: db
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  campusbite_mysql_data:
